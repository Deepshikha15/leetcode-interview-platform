services:
  - type: web
    name: leetcodepro-interview-platform
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_HEADCOUNT_TABLE
        value: signup_headcount
      - key: SUPABASE_LOGIN_EVENTS_TABLE
        value: login_events

